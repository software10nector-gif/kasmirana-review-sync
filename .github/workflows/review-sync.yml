name: Kasmirana Review Sync

# Runs on a SELF-HOSTED runner (a real office PC on a residential/business
# ISP connection), NOT GitHub's own hosted runners. Meesho runs Akamai Bot
# Manager, which was confirmed (via direct network inspection) to reject
# the very first request at the network level from GitHub's own datacenter
# IP ranges — no browser fingerprint trick fixes that, since it's an IP/TLS
# reputation decision, not a JS-challenge. A real ISP connection has a much
# better trust reputation with these systems than any cloud provider's IPs.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab
    inputs:
      source:
        description: "Which source(s) to sync"
        type: choice
        default: "all"
        options:
          - all
          - flipkart
          - meesho

# Only one sync should ever run at a time.
concurrency:
  group: review-sync
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit docs/reviews.json back to the repo

jobs:
  sync:
    runs-on: [self-hosted, kasmirana-office]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        working-directory: scraper
        run: playwright install chromium

      # Real Google Chrome (not bundled Chromium) is closer to what a real
      # user's browser reports — missing proprietary bits in Chromium
      # (codecs, Widevine) are one of the signals Akamai's bot detection
      # (which Meesho runs) checks for. base_scraper.py tries this channel
      # first and falls back to Chromium automatically if unavailable.
      - name: Install real Google Chrome
        working-directory: scraper
        run: playwright install chrome

      - name: Run the review sync
        working-directory: scraper
        env:
          FLIPKART_PRODUCT_URL: ${{ secrets.FLIPKART_PRODUCT_URL }}
          MEESHO_PRODUCT_URL: ${{ secrets.MEESHO_PRODUCT_URL }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_API_USERNAME: ${{ secrets.WP_API_USERNAME }}
          WP_API_APP_PASSWORD: ${{ secrets.WP_API_APP_PASSWORD }}
          WP_SYNC_SHARED_SECRET: ${{ secrets.WP_SYNC_SHARED_SECRET }}
          # Running headFUL (a real visible browser window) on this
          # self-hosted PC — even genuine Chrome with the --headless flag
          # is itself a detectable automation signal some anti-bot systems
          # key on; a real ISP IP + a real, visibly-rendering Chrome window
          # removes essentially every automation signal except the CDP
          # protocol Playwright uses to drive it.
          HEADLESS: "false"
        run: python main.py --source ${{ github.event.inputs.source || 'all' }}

      # docs/reviews.json is what GitHub Pages serves for WordPress to pull —
      # commit it back only if it actually changed (avoids empty commits).
      # if: always() is essential here — main.py exits non-zero whenever ANY
      # one source fails (e.g. Meesho blocked), but a source that DID
      # succeed (e.g. Flipkart) still wrote real data to the file, and that
      # partial progress must not be thrown away just because its sibling
      # source failed in the same run.
      # Written in PowerShell (this runner's default shell) instead of bash —
      # a custom bash.exe shell path was tried and rejected by the runner
      # ("Second path fragment must not be a drive or UNC name"), so this
      # avoids the whole bash-vs-WSL question by not needing bash at all.
      - name: Commit updated reviews.json
        if: always()
        run: |
          git config user.name "kasmirana-review-bot"
          git config user.email "actions@github.com"
          git add docs/reviews.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
          } else {
            git commit -m "Update synced reviews [skip ci]"
            git push
          }

      # Keeps a copy of the run's log as a downloadable artifact for 14 days,
      # so you can debug a failed/odd run without re-running it.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-sync-logs-${{ github.run_number }}
          path: scraper/logs/*.log
          retention-days: 14
